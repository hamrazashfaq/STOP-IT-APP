name: Android APK

on:
  push:
    branches:
      - arena/0d24a82f-stop-it-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Check project metadata and localization
        run: python3 tool/verify_project.py

      - name: Run Flutter static analysis
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --machine > /tmp/flutter-analyze.txt 2>&1
          result=$?
          cat /tmp/flutter-analyze.txt
          python3 tool/emit_analyzer_annotations.py /tmp/flutter-analyze.txt
          exit $result

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK for device testing
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stop-it-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
